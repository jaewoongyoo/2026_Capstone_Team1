services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dashboard-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - dashboard-net

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - dashboard-net

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.onprem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt-broker:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dashboard}
      DB_USERNAME: ${POSTGRES_USER:-dashboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      KAFKA_ENABLED: "false"
      RABBIT_ENABLED: "false"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - dashboard-net

  mcp-server:
    build:
      context: ../..
      dockerfile: mcp-server/Dockerfile.onprem
    depends_on:
      backend:
        condition: service_started
    environment:
      DASHBOARD_API_BASE_URL: http://backend:8080
      DASHBOARD_TLS_REJECT_UNAUTHORIZED: "true"
      MCP_HTTP_PORT: 3333
      MCP_HTTP_CORS_ORIGIN: ${MCP_HTTP_CORS_ORIGIN:-*}
    expose:
      - "3333"
    restart: unless-stopped
    networks:
      - dashboard-net

  edge-gateway:
    build:
      context: ../..
      dockerfile: edge/Dockerfile
    depends_on:
      mqtt-broker:
        condition: service_started
    environment:
      MQTT_HOST: mqtt-broker
      EDGE_GATEWAY_BIND_HOST: 0.0.0.0
      PYTHONUNBUFFERED: "1"
    ports:
      - "${EDGE_GATEWAY_CVD_PORT:-5000}:5000"
      - "${EDGE_GATEWAY_ETCHER_PORT:-5001}:5001"
    restart: unless-stopped
    networks:
      - dashboard-net

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile.onprem
      args:
        VITE_MCP_CHAT_URL: ${VITE_MCP_CHAT_URL:-/api/mcp/chat}
        VITE_WS_URL: ${VITE_WS_URL:-/ws-stomp}
    depends_on:
      backend:
        condition: service_started
      mcp-server:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
