# =============================================================================
# Mosquitto MQTT 브로커 설정
# =============================================================================

# ── 기본 리스너 (MQTT) ────────────────────────────────────────────────────────
listener 1883
protocol mqtt

# ── WebSocket 리스너 (브라우저 직접 구독용) ───────────────────────────────────
listener 9001
protocol websockets

# ── 인증 (시뮬레이터는 익명 허용) ────────────────────────────────────────────
allow_anonymous true

# ── 로그 ─────────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ── 데이터 영속성 ─────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
